<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reserva - BGS Car</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">


    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-bgs">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/img/bgscar.png" alt="Logo BGS Car" class="logo-bgs">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="flota.html">Flota</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item align-self-center">

                        <a class="nav-link active text-bgs fw-bold" href="carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito (<span id="contador-carrito">0</span>)
                        </a>
                    </li>
                    <li class="nav-item ms-3">
                        <a id="enlace-login" href="login.html" class="btn btn-outline-bgs btn-sm">
                            <i class="bi bi-person-fill"></i> Iniciar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <h2 class="mb-4 text-light">Tu <span class="text-bgs">Reserva</span></h2>
        
        <div class="row">

            <div class="col-lg-8 mb-4">
                <div class="table-responsive bg-black p-3 rounded-3 border border-secondary shadow">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr class="border-secondary">
                                <th scope="col" class="text-white-50">Vehículo</th>
                                <th scope="col" class="text-white-50">Precio/Día</th>
                                <th scope="col" class="text-white-50">Días</th>
                                <th scope="col" class="text-white-50 text-end">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-carrito">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card bg-black border-secondary shadow sticky-top" style="top: 20px;">
                    <div class="card-body p-4">
                        <h5 class="card-title text-light border-bottom border-secondary pb-3 mb-4">Resumen de Orden</h5>
                        
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 text-white-50">Total a pagar:</span>
                            <span class="fs-3 fw-bold text-bgs" id="total-carrito">$0</span>
                        </div>

                        <button id="btn-confirmar" class="btn btn-bgs w-100 fw-bold py-2 mb-2">Confirmar Reserva</button>
                        <button id="btn-vaciar" class="btn btn-outline-danger w-100 py-2">Vaciar Carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black py-4 border-top border-bgs mt-auto">
        <div class="container text-center text-md-start">
            <p class="small text-muted mb-0">&copy; 2026 BGS Car. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>

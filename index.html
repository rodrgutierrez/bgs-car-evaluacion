<body class="bg-dark text-light"> 

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-bgs">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/img/bgscar.png" alt="Logo BGS Car" class="logo-bgs">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="flota.html">Flota</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item align-self-center">
                        <a class="nav-link text-bgs fw-bold" href="carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito (<span id="contador-carrito">0</span>)
                        </a>
                    </li>
                    <li class="nav-item ms-3">
                        <a href="login.html" class="btn btn-outline-bgs btn-sm">
                            <i class="bi bi-person-fill"></i> Iniciar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero-section text-center py-5 d-flex flex-column justify-content-center align-items-center" style="min-height: 60vh; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?q=80&w=2000') center/cover;">
            <h1 class="display-4 fw-bold text-bgs mb-3">Renta tu auto fácilmente</h1>
            <p class="lead mb-5">Encuentra las mejores ofertas con BGS Car</p>

            <div class="container">
                <form id="busqueda-form" class="bg-dark bg-opacity-75 p-4 rounded-3 border border-secondary shadow">
                    <div class="row g-3 align-items-end justify-content-center">
                        <div class="col-md-3 text-start">
                            <label for="sucursal" class="form-label text-bgs small fw-bold">Sucursal</label>
                            <select class="form-select bg-dark text-light border-secondary" id="sucursal" required>
                                <option value="">Seleccione...</option>
                                <option value="santiago">Santiago</option>
                                <option value="valparaiso">Valparaíso</option>
                                <option value="concepcion">Concepción</option>
                            </select>
                        </div>
                        <div class="col-md-3 text-start">
                            <label for="fecha-retiro" class="form-label text-bgs small fw-bold">Fecha de Retiro</label>
                            <input type="date" class="form-control bg-dark text-light border-secondary" id="fecha-retiro" required>
                        </div>
                        <div class="col-md-3 text-start">
                            <label for="fecha-devolucion" class="form-label text-bgs small fw-bold">Fecha de Devolución</label>
                            <input type="date" class="form-control bg-dark text-light border-secondary" id="fecha-devolucion" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-bgs w-100 fw-bold">Buscar Autos</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="py-5 bg-dark">
            <div class="container">
                <h2 class="text-center mb-5 border-bottom border-bgs pb-2 d-inline-block">Nuestros Autos Destacados</h2>
                
                <div class="row g-4" id="contenedor-destacados">

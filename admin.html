<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - BGS Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-black border-bottom border-danger">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-danger fw-bold" href="index.html">
                <i class="bi bi-shield-lock-fill"></i> ADMIN BGS Car
            </a>
            <div>
                <span class="text-white-50 me-3">Panel de Control</span>
                <a href="index.html" class="btn btn-outline-light btn-sm">Ir al Sitio</a>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4 flex-grow-1 px-4">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card bg-black border-secondary">
                    <div class="card-header border-secondary text-bgs fw-bold">
                        Añadir Nuevo Vehículo
                    </div>
                    <div class="card-body">
                        <form id="form-admin">
                            <div class="mb-3">
                                <label class="form-label small text-white-50">Marca</label>
                                <input type="text" id="admin-marca" class="form-control form-control-sm bg-dark text-light border-secondary">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-white-50">Modelo</label>
                                <input type="text" id="admin-modelo" class="form-control form-control-sm bg-dark text-light border-secondary">
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-white-50">Categoría</label>
                                    <select id="admin-categoria" class="form-select form-select-sm bg-dark text-light border-secondary">
                                        <option value="sedan">Sedán</option>
                                        <option value="suv">SUV</option>
                                        <option value="deportivo">Deportivo</option>
                                        <option value="camioneta">Camioneta</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-white-50">Transmisión</label>
                                    <select id="admin-transmision" class="form-select form-select-sm bg-dark text-light border-secondary">
                                        <option value="Automático">Automático</option>
                                        <option value="Manual">Manual</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-white-50">Precio por Día (CLP)</label>
                                <input type="number" id="admin-precio" class="form-control form-control-sm bg-dark text-light border-secondary">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small text-white-50">URL de la Imagen</label>
                                <input type="text" id="admin-imagen" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="https://ejemplo.com/auto.jpg">
                            </div>
                            <button type="button" id="btn-guardar-auto" class="btn btn-success w-100 btn-sm">Guardar Vehículo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card bg-black border-secondary h-100">
                    <div class="card-header border-secondary text-bgs fw-bold d-flex justify-content-between align-items-center">
                        Flota Actual
                        <span class="badge bg-secondary" id="total-autos">0 vehículos</span>
                    </div>
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-dark table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Vehículo</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-admin">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BGS Car</title>
    <!-- Bootstrap y CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-bgs">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/img/bgscar.png" alt="Logo BGS Car" class="logo-bgs">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="flota.html">Flota</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <li class="nav-item align-self-center">
                        <a class="nav-link text-bgs fw-bold" href="carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito (<span id="contador-carrito">0</span>)
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1 d-flex justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5">
            <div class="card bg-black border-secondary shadow-lg">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4 text-light">Bienvenido a <span class="text-bgs">BGS Car</span></h2>

                    <form id="formulario-login">
                        <div class="mb-3">
                            <label for="nombre" class="form-label text-white-50">Nombre</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nombre" placeholder="Ej: Juan">
                        </div>

                        <div class="mb-3">
                            <label for="apellido" class="form-label text-white-50">Apellido</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="apellido" placeholder="Ej: Pérez">
                        </div>

                        <div class="mb-3">
                            <label for="rut" class="form-label text-white-50">RUT (Sin puntos y con guion)</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="rut" placeholder="Ej: 12345678-9">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label text-white-50">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="correo" placeholder="nombre@correo.com">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-white-50">Contraseña</label>
                            <input type="password" id="password" class="form-control bg-dark text-light border-secondary" placeholder="Ej: 123456">
                            <div class="form-text text-white-50 small mt-1">
                                <i class="bi bi-info-circle me-1"></i> La contraseña debe tener entre 4 y 10 caracteres.
                            </div>
                        </div>

                        <button type="button" id="btn-login" class="btn btn-bgs w-100 fw-bold py-2">Crear Cuenta / Ingresar</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-bgs mt-auto">
        <div class="container text-center text-md-start">
            <p class="small text-muted mb-0">&copy; 2026 BGS Car. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - BGS Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-bgs">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/img/bgscar.png" alt="Logo BGS Car" class="logo-bgs">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="flota.html">Flota</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    <li class="nav-item align-self-center">
                        <a class="nav-link text-bgs fw-bold" href="carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito (<span id="contador-carrito">0</span>)
                        </a>
                    </li>
                    <li class="nav-item ms-3">
                        <a id="enlace-login" href="login.html" class="btn btn-outline-bgs btn-sm">
                            <i class="bi bi-person-fill"></i> Iniciar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bg-black border-secondary text-light p-4 shadow">
                    <h3 class="fw-bold text-bgs text-center mb-4">¿Tienes dudas o consultas?</h3>
                    <form onsubmit="event.preventDefault(); alert('¡Gracias por contactarnos! Te responderemos a la brevedad.'); this.reset();">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Nombre Completo</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50 small">Mensaje</label>
                            <textarea class="form-control bg-dark text-light border-secondary" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-bgs w-100 fw-bold">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-bgs mt-auto">
        <div class="container text-center text-md-start">
            <p class="small text-muted mb-0">&copy; 2026 BGS Car. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
